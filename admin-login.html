<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Ethio-Uni-Guide</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="admin-login-page">

        <div class="admin-login-card">

            <!-- LOGO -->
            <div class="admin-logo">
                <img src="images/logo.png" alt="Ethio-Uni-Guide Logo">
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Sign in to manage university information
            </p>

            <!-- LOGIN FORM -->
            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter admin email"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                </div>


                <button type="submit" class="admin-login-button">
                    <i data-lucide="log-in"></i>
                    Login
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <a href="index.html" class="back-home">
                ← Back to website
            </a>

        </div>

    </div>


    <script>
        lucide.createIcons();
    </script>

    <script src="admin-login.js"></script>

</body>

</html>
